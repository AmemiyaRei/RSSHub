name: InsightAgent RSSHub image

on:
    push:
        branches: [master]
        paths:
            - 'lib/**'
            - 'Dockerfile'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/insightagent-ghcr.yml'
    workflow_dispatch: {}

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  run_install: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: pnpm
            - name: Test custom route
              run: |
                  pnpm install --frozen-lockfile
                  pnpm vitest run lib/zhidx-route.test.ts
            - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
              with:
                  images: ghcr.io/${{ github.repository_owner }}/rsshub
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long,prefix=
            - id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Print immutable image
              run: echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rsshub@${{ steps.build.outputs.digest }}"
